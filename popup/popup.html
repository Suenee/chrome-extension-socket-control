<!doctype html><html><head><meta charset="utf-8"><title>Socket Control</title><link rel="stylesheet" href="popup.css"></head><body><main><h1>Socket Control <span>v0.15</span></h1><label>Server<input id="host" placeholder="127.0.0.1"></label><label>Port<input id="port" type="number" min="1" max="65535" placeholder="8170"></label><label>Socket Box<input id="socketBox" placeholder="chrome"></label><label>API key<input id="apiKey" type="text" autocomplete="off"></label><label class="check"><input id="autoConnect" type="checkbox"> Connect automatically when browser starts</label><section><div class="status"><i id="light"></i><strong id="state">Loading…</strong></div><div id="detail"></div><div id="formError"></div></section><div class="buttons"><button id="reset" class="icon" title="Reset form to defaults" aria-label="Reset form to defaults">↺</button><button id="toggle">Connect</button><button id="close">Close</button></div><details><summary>Diagnostics</summary><pre id="diag"></pre></details></main><script type="module" src="popup.js"></script></body></html>
